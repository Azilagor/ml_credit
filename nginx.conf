user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream ml_credit_app {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;
        root /home/alibek/projects/ml_credit;

        access_log /var/log/nginx/ml_credit_access.log;
        error_log /var/log/nginx/ml_credit_error.log;

        location /static/ {
            alias /home/alibek/projects/ml_credit/static/;
            access_log off;
            expires 30d;
        }

        location / {
            proxy_pass http://ml_credit_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }
    }
}
